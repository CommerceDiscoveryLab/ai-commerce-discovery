[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce-discovery"
version = "0.1.0"
description = "Prepare truthful product catalogs for AI discovery with JSON-LD, feeds and offline audits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/CommerceDiscoveryLab/ai-commerce-discovery"
Documentation = "https://github.com/CommerceDiscoveryLab/ai-commerce-discovery/tree/main/docs"
Issues = "https://github.com/CommerceDiscoveryLab/ai-commerce-discovery/issues"

[project.scripts]
commerce-discovery = "commerce_discovery.__main__:main"

[tool.setuptools.packages.find]
include = ["commerce_discovery*"]
