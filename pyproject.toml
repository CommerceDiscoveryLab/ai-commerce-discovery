[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-commerce-discovery"
version = "0.1.0"
description = "Prepare truthful product catalogs for AI discovery with JSON-LD, feeds and offline audits"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
commerce-discovery = "commerce_discovery.__main__:main"

[tool.setuptools.packages.find]
include = ["commerce_discovery*"]
